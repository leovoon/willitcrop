                  "@type": "Answer",
                  "text": "For 9:16 vertical videos (1080x1920 px), keep key visuals away from the top 15%, bottom 25%, and right 18% which are reserved for UI elements."

                "@type": "Question",
                "name": "Why does an Instagram carousel crop if photos have different ratios?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Instagram locks the carousel to the first slide's aspect ratio. All subsequent slides are cropped to match."
                }
